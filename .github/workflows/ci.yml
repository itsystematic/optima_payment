name: CI

on:
  push:
    branches: [develop, version-16]
  pull_request:
    branches: [develop, version-16]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: App tests
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      # Importing any ERPNext test module runs its BootStrapTestData, which commits
      # _Test Company, users and System Settings changes. Tests build their records
      # with optima_payment's own factories instead.
      - name: Refuse imports of ERPNext test modules
        run: |
          if grep -rnE "erpnext[.a-z_]*\.(tests|test_[a-z_]+)" --include=*.py optima_payment/; then
            echo "::error::A test imports an ERPNext test module; use optima_payment's factories instead."
            exit 1
          fi

      # Frappe 16 requires Python ">=3.14,<3.15" and Node ">=24".
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py3.14-pip-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-py3.14-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-client libmariadb-dev

      - name: Initialize bench
        run: |
          pip install frappe-bench
          bench init \
            --skip-redis-config-generation \
            --skip-assets \
            --frappe-branch version-16 \
            --python "$(which python)" \
            ~/frappe-bench

      - name: Install apps
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench get-app https://github.com/frappe/erpnext --branch version-16 --resolve-deps
          bench get-app optima_payment "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench set-config -g root_password root
          # bench init skipped the redis config, so point cache, queue and socketio at the
          # one CI redis service, or the after_install jobs fail with "Connection refused".
          bench set-config -g redis_cache "redis://127.0.0.1:6379"
          bench set-config -g redis_queue "redis://127.0.0.1:6379"
          bench set-config -g redis_socketio "redis://127.0.0.1:6379"
          bench new-site test_site \
            --db-root-password root \
            --admin-password admin \
            --mariadb-user-host-login-scope='%'
          bench --site test_site install-app erpnext optima_payment

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          mapfile -t test_modules < <(python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          package_dir = root / "optima_payment"

          # Discover every test_*.py under the package, not just optima_payment/tests/,
          # so doctype-local test files (e.g. <doctype>/test_<doctype>.py) run too.
          # New test files are picked up automatically; no edits needed here.
          for path in sorted(package_dir.rglob("test_*.py")):
              print(".".join(path.relative_to(root).with_suffix("").parts))
          PY
          )

          failed=()
          for module in "${test_modules[@]}"; do
            echo "::group::${module}"
            bench --site test_site run-tests --module "${module}" || failed+=("${module}")
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then
            printf '::error::%s failed\n' "${failed[@]}"
            exit 1
          fi
